<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Биохимия: тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one working column (question) + side rail (test map); rail drops below at phone width */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --line:#E2E8F0; --fg:#0F1B2D; --muted:#5B6B80;
  --navy:#0F4C81; --navy-soft:#E6EEF6; --teal:#00A896; --teal-soft:#E0F5F2;
  --ok:#2F9E6E; --ok-soft:#E5F4EC; --bad:#D0584F; --bad-soft:#FBEAE8;
  --skip:#E08A2E; --skip-soft:#FCF0E2; --idle:#CBD5E1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1420; --surface:#121E2D; --line:#22324A; --fg:#E6EDF5; --muted:#91A2B8;
  --navy:#5B9BD5; --navy-soft:#16283D; --teal:#2CC4B0; --teal-soft:#0F2E2C;
  --ok:#4CC38A; --ok-soft:#12291F; --bad:#EC7A71; --bad-soft:#2E1A1A;
  --skip:#F0A458; --skip-soft:#2E2213; --idle:#33445C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1420; --surface:#121E2D; --line:#22324A; --fg:#E6EDF5; --muted:#91A2B8;
  --navy:#5B9BD5; --navy-soft:#16283D; --teal:#2CC4B0; --teal-soft:#0F2E2C;
  --ok:#4CC38A; --ok-soft:#12291F; --bad:#EC7A71; --bad-soft:#2E1A1A;
  --skip:#F0A458; --skip-soft:#2E2213; --idle:#33445C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  font-feature-settings:"kern" 1,"liga" 1;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--navy)}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.timer{font-family:var(--mono);font-size:14px;padding:6px 12px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}
h1,h2{text-wrap:balance;letter-spacing:-.02em;margin:0}
h1{font-size:28px;line-height:1.2}
h2{font-size:20px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;
  border:1px solid var(--line);background:var(--surface);transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--navy)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#0B1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1420}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* setup */
.setup{display:grid;gap:20px;max-width:720px}
.setup p.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:500}
.field{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;transition:all .15s}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mode{text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);transition:all .15s}
.mode b{display:block;font-size:15px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:var(--teal-soft)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics .chip{font-weight:500;font-size:13px;padding:6px 12px}

/* quiz */
.progress{margin-bottom:16px}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.progress .row b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--teal));border-radius:99px;transition:width .35s ease}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media (max-width:760px){.quiz{grid-template-columns:1fr}}
.qcard{min-width:0}
.qcard.enter{animation:slide .28s ease}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.qtext{font-size:19px;font-weight:600;line-height:1.4;letter-spacing:-.01em;margin:0 0 20px;hyphens:auto;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  transition:transform .08s,background .15s,border-color .15s;hyphens:auto;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.opt.picked{border-color:var(--navy);background:var(--navy-soft)}
.opt.picked .k{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-weight:600}
.hint{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--teal-soft);font-size:14px;border:1px dashed var(--teal)}
.hint .eyebrow{color:var(--teal)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;align-items:center}
.actions .sp{flex:1}
.kbd{font-size:12px;color:var(--muted);margin-top:12px}
.kbd code{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:4px}

.map{padding:18px}
.map h3{margin:0 0 12px;font-size:13px;font-weight:600}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px;max-height:320px;overflow:auto;padding:2px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--idle);color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .1s}
.dot:hover{transform:scale(1.08)}
.dot.answered{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.wrongd{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.dot.skipped{background:var(--skip);border-color:var(--skip);color:var(--surface)}
.dot.cur{box-shadow:0 0 0 3px var(--navy);border-color:var(--navy)}
.dot.cur:not(.answered):not(.skipped):not(.wrongd){background:var(--navy);color:var(--surface)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.map .btn{width:100%;margin-top:14px}
.warn{margin-top:10px;font-size:13px;color:var(--skip);display:grid;gap:8px}

/* result */
.result{display:grid;gap:20px}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.donut{width:180px;height:180px;max-width:100%}
.big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.counts{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:14px;color:var(--muted)}
.counts span{display:flex;align-items:center;gap:6px}
.counts i{width:10px;height:10px;border-radius:3px}
.verdict{margin-top:8px;color:var(--muted)}
.weak{display:grid;gap:12px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:12px;align-items:center;font-size:14px}
@media (max-width:480px){.wrow{grid-template-columns:minmax(0,1fr) 60px 44px}}
.wrow .mini{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.wrow .mini i{display:block;height:100%;background:var(--bad)}
.wrow .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.wrow.good .mini i{background:var(--ok)}
.insight{padding:12px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.insight.okay{background:var(--ok-soft);color:var(--ok)}

/* flashcards */
.fc-wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
.fc{perspective:1400px;cursor:pointer;min-height:300px}
.fc-inner{position:relative;min-height:300px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--teal-soft);border-color:var(--teal)}
.face .qtext{margin:0;font-size:18px}
.face .tap{margin-top:auto;font-size:12px;color:var(--muted)}
.ans{font-size:20px;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.yours{font-size:14px;color:var(--bad)}
.fc-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fc-nav .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><polygon points="15,3 25.4,9 25.4,21 15,27 4.6,21 4.6,9" fill="none" stroke="var(--navy)" stroke-width="2.2"/><circle cx="15" cy="15" r="3.6" fill="var(--teal)"/></svg>
      <div>Биохимия<small>тренажёр для зачёта</small></div>
    </div>
    <div class="timer" id="timer" hidden>00:00</div>
  </header>

  <!-- SETUP -->
  <section id="s-setup" class="setup">
    <div>
      <h1>Настрой тест и поехали</h1>
      <p class="lead">Вопросы из сборника, страницы 237–340: белки и аминокислоты, минерализованные ткани, слюна. Порядок вариантов меняется при каждом запуске.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="panel field">
      <div class="eyebrow">Количество вопросов</div>
      <div class="chips" id="counts"></div>
    </div>
    <div class="panel field">
      <div class="eyebrow">Режим</div>
      <div class="modes">
        <button class="mode" data-mode="learn" aria-pressed="true" id="m-learn"><b>Обучение</b><span>Правильный ответ сразу после каждого вопроса</span></button>
        <button class="mode" data-mode="exam" aria-pressed="false" id="m-exam"><b>Экзамен</b><span>Итог только в конце, таймер 1 мин на вопрос</span></button>
      </div>
    </div>
    <div class="panel field">
      <div class="eyebrow">Разделы</div>
      <div class="topics" id="sections"></div>
    </div>
    <div><button class="btn primary" id="start" style="padding:13px 26px;font-size:15px">Начать тест</button></div>
  </section>

  <!-- QUIZ -->
  <section id="s-quiz" hidden>
    <div class="progress">
      <div class="row"><span id="ptext"></span><span id="pstat"></span></div>
      <div class="bar"><i id="pbar" style="width:0"></i></div>
    </div>
    <div class="quiz">
      <div class="panel qcard" id="qcard"></div>
      <aside class="panel map">
        <h3>Карта теста</h3>
        <div class="dots" id="dots"></div>
        <div class="legend">
          <span><i style="background:var(--idle)"></i>Не решён</span>
          <span><i style="background:var(--ok)"></i>Отвечен</span>
          <span><i style="background:var(--skip)"></i>Пропущен</span>
          <span><i style="background:var(--navy)"></i>Текущий</span>
          <span id="lg-wrong" hidden><i style="background:var(--bad)"></i>Ошибка</span>
        </div>
        <button class="btn" id="finish">Завершить тест</button>
        <div class="warn" id="warn" hidden></div>
      </aside>
    </div>
  </section>

  <!-- RESULT -->
  <section id="s-result" class="result" hidden></section>

  <!-- REVIEW -->
  <section id="s-review" hidden></section>
</div>

<script>

function buildOptions(item) {

};
document.addEventListener("keydown", e => {
  if ($("#s-quiz").hidden || e.target.closest("input,textarea")) return;
  const it = T.items[T.idx];
  if (/^[1-7]$/.test(e.key)) { const b = $(`#qcard .opt[data-i="${+e.key - 1}"]`); if (b && !b.disabled) b.click(); }
  else if (e.key === "Enter") { const b = $("#b-main"); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
  else if (e.key === "ArrowRight") go(T.idx + 1);
  else if (e.key === "ArrowLeft") go(T.idx - 1);
});

/* ---------- result ---------- */
function finish() {
  clearInterval(timerId); $("#timer").hidden = true;
  const items = T.items, n = items.length;
  const right = items.filter(isRight).length;
  const wrong = items.filter(x => x.status === "answered" && !isRight(x)).length;
  const blank = n - right - wrong;
  const pct = Math.round(right / n * 100);
  T.mistakes = items.filter(x => !isRight(x));

  // donut
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const seg = (v, col) => { if (!v) return ""; const len = v / n * C; const s = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`; off += len; return s; };
  const donut = `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Верно ${right}, неверно ${wrong}, без ответа ${blank}">
    <circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--line)" stroke-width="22"/>
    ${seg(right, "var(--ok)")}${seg(wrong, "var(--bad)")}${seg(blank, "var(--skip)")}
    <text x="90" y="86" text-anchor="middle" font-size="30" font-weight="700" fill="var(--fg)" font-family="Inter,sans-serif">${right}/${n}</text>
    <text x="90" y="108" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Inter,sans-serif">верных</text></svg>`;

  // topics
  const by = {};
  items.forEach(x => { (by[x.t] ||= { n: 0, bad: 0 }).n++; if (!isRight(x)) by[x.t].bad++; });
  const rows = Object.entries(by).map(([t, v]) => ({ t, ...v, r: v.bad / v.n })).sort((a, b) => b.r - a.r || b.n - a.n);
  const worst = rows.find(r => r.bad > 0 && r.n >= 2) || rows.find(r => r.bad > 0);
  const insight = worst
    ? `<div class="insight">Слабое место: ты ошибся в ${Math.round(worst.r * 100)}% вопросов по теме «${esc(worst.t)}» (${worst.bad} из ${worst.n}).</div>`
    : `<div class="insight okay">Ошибок нет ни в одной теме. Можно брать больше вопросов.</div>`;
  const verdict = pct >= 90 ? "Отлично, материал усвоен." : pct >= 70 ? "Хорошо, но есть что подтянуть." : pct >= 50 ? "Средне. Пройди разбор ошибок." : "Пока слабо. Начни с режима обучения.";

  $("#s-result").innerHTML = `
    <div class="panel score">
      ${donut}
      <div>
        <div class="eyebrow">${T.mode === "exam" ? "Экзамен" : "Обучение"} · ${n} вопросов</div>
        <div class="big">${pct}%</div>
        <div class="verdict">${verdict}</div>
        <div class="counts">
          <span><i style="background:var(--ok)"></i>Верно: ${right}</span>
          <span><i style="background:var(--bad)"></i>Неверно: ${wrong}</span>
          <span><i style="background:var(--skip)"></i>Без ответа: ${blank}</span>
        </div>
      </div>
    </div>
    <div class="panel weak">
      <h2>Аналитика по темам</h2>
      ${insight}
      ${rows.map(r => `<div class="wrow ${r.bad ? "" : "good"}"><span>${esc(r.t)} <span style="color:var(--muted)">· ${r.n}</span></span>
        <div class="mini"><i style="width:${r.bad ? r.r * 100 : 100}%"></i></div><span class="pct">${r.bad ? Math.round(r.r * 100) + "%" : "✓"}</span></div>`).join("")}
      <div style="font-size:12px;color:var(--muted)">Процент — доля ошибок в теме.</div>
    </div>
    <div class="actions" style="margin-top:0">
      <button class="btn" id="r-home">Вернуться к началу</button>
      <button class="btn primary" id="r-review" ${T.mistakes.length ? "" : "disabled"}>Разбор ошибок (${T.mistakes.length})</button>
    </div>`;
  $("#r-home").onclick = () => { renderSetup(); show("setup"); };
  $("#r-review").onclick = () => { T.fc = 0; renderReview(); show("review"); };
  show("result");
}

/* ---------- flashcards ---------- */
function renderReview() {
  const m = T.mistakes, it = m[T.fc];
  const yours = it.sel != null ? `Твой ответ: ${esc(it.opts[it.sel])}` : "Ты не ответил на этот вопрос";
  $("#s-review").innerHTML = `
    <div class="fc-wrap">
      <div class="fc-nav"><h2>Разбор ошибок</h2><span class="n">${T.fc + 1} / ${m.length}</span></div>
      <div class="fc" id="fc" tabindex="0" role="button" aria-label="Перевернуть карточку">
        <div class="fc-inner">
          <div class="face"><span class="eyebrow">${esc(it.t)}</span><p class="qtext">${esc(it.q)}</p><span class="tap">Нажми, чтобы перевернуть</span></div>
          <div class="face back"><span class="eyebrow" style="color:var(--teal)">Правильный ответ</span><div class="ans">${esc(it.a)}</div>
            <div class="yours">${yours}</div><span class="tap">Тема: ${esc(it.t)} · ${esc(SECTIONS[it.s])}</span></div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="btn" id="f-prev" ${T.fc ? "" : "disabled"}>← Назад</button>
        <button class="btn ghost" id="f-res">К результатам</button>
        <button class="btn primary" id="f-next">${T.fc < m.length - 1 ? "Дальше →" : "Готово"}</button>
      </div>
    </div>`;
  const fc = $("#fc"), flip = () => fc.classList.toggle("flip");
  fc.onclick = flip; fc.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
  $("#f-prev").onclick = () => { T.fc--; renderReview(); };
  $("#f-next").onclick = () => { if (T.fc < m.length - 1) { T.fc++; renderReview(); } else show("result"); };
  $("#f-res").onclick = () => show("result");
}

renderSetup();
</script>

</html>
